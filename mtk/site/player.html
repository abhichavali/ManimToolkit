<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a player-first study page. The stage (video, chapter timeline, chapters, transcript) on the left,
   the shelf of episodes and problems on the right; one column on phones. Dark-first, like the videos. */
:root {
  --bg: #0f1116; --surface: #15171c; --raise: #1b1e25; --hair: #262a33;
  --ink: #eef0f4; --ink2: #b4b9c6; --muted: #7d8394; --accent: #95a2ff; --on-accent: #0f1116;
  --sky: #4a95ff; --ember: #ff7a3d; --mint: #22c58b; --lilac: #a497ff; --gold: #ffd27a; --rose: #f06ea0;
  --good: #35c46a; --scrim: rgba(15, 17, 22, .78); --paper: #ffffff;
  --display: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f5f8; --surface: #ffffff; --raise: #eceef3; --hair: #dadde5;
  --ink: #12141a; --ink2: #3a404d; --muted: #646b7a; --accent: #4a57c9; --on-accent: #ffffff;
  --sky: #1f6fe0; --ember: #d9581c; --mint: #0f8f62; --lilac: #6c5ce0; --gold: #a67200; --rose: #c43a72;
  --good: #1e8a47; --scrim: rgba(15, 17, 22, .72); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f4f5f8; --surface: #ffffff; --raise: #eceef3; --hair: #dadde5;
  --ink: #12141a; --ink2: #3a404d; --muted: #646b7a; --accent: #4a57c9; --on-accent: #ffffff;
  --sky: #1f6fe0; --ember: #d9581c; --mint: #0f8f62; --lilac: #6c5ce0; --gold: #a67200; --rose: #c43a72;
  --good: #1e8a47; --scrim: rgba(15, 17, 22, .72); color-scheme: light; }

body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 28px; }
.top { display: grid; gap: 10px; }
.kicker { font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font: 800 clamp(28px, 4.2vw, 46px)/1.08 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.blurb { margin: 0; color: var(--ink2); max-width: 64ch; }
.bar { display: flex; gap: 4px; margin-top: 6px; }
.bar i { width: 28px; height: 4px; border-radius: 1px; }
.meta { color: var(--muted); font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }

.layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.stage { display: grid; gap: 16px; min-width: 0; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
.frame video { width: 100%; height: 100%; display: block; background: #000; }
.vov { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%; text-align: center;
  padding: 10px 16px; border-radius: 8px; background: var(--scrim); color: #eef0f4; font: 500 14px/1.4 var(--body);
  pointer-events: none; }
.vov button { pointer-events: auto; }
.next { font: 600 15px/1.2 var(--body); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 999px;
  padding: 10px 18px; cursor: pointer; }
.now { display: grid; gap: 4px; min-width: 0; }
.now h2 { font: 800 clamp(20px, 2.4vw, 26px)/1.2 var(--display); margin: 0; text-wrap: balance; }
.now .sub { margin: 0; color: var(--ink2); }

.tl { position: relative; display: flex; gap: 2px; height: 10px; cursor: pointer; }
.tl span { height: 100%; border-radius: 2px; opacity: .55; transition: opacity .15s; }
.tl span.on { opacity: 1; }
.tl .head { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); border-radius: 1px; pointer-events: none; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chapters button { width: 100%; display: grid; grid-template-columns: 12px 56px minmax(0, 1fr); gap: 10px; align-items: center;
  text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 10px; color: var(--ink2); font: 500 14px/1.35 var(--body); cursor: pointer; }
.chapters button:hover { background: var(--raise); color: var(--ink); }
.chapters button[aria-current="true"] { background: var(--raise); color: var(--ink); font-weight: 600; }
.chapters .dot { width: 10px; height: 10px; border-radius: 50%; }
.chapters time { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }

details.tx { border-top: 1px solid var(--hair); padding-top: 12px; }
details.tx summary { cursor: pointer; font: 600 14px/1.2 var(--body); color: var(--ink2); }
.txb { margin-top: 12px; max-height: 340px; overflow-y: auto; display: grid; gap: 4px; padding-right: 6px; }
.txb button { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; text-align: left; background: none; border: 0;
  padding: 4px 6px; border-radius: 5px; color: var(--ink2); font: 400 14px/1.5 var(--body); cursor: pointer; }
.txb button:hover { background: var(--raise); }
.txb button.on { color: var(--ink); background: var(--raise); }
.txb time { font: 500 12px/1.9 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.shelf { display: grid; gap: 22px; min-width: 0; }
.shelf h3 { margin: 0 0 8px; font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.shelf ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.card { width: 100%; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; color: var(--ink); cursor: pointer; font: inherit; }
.card:hover { background: var(--surface); }
.card[aria-current="true"] { background: var(--surface); border-color: var(--hair); }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 5px; overflow: hidden; background: var(--raise); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .dur { position: absolute; right: 4px; bottom: 6px; padding: 1px 5px; border-radius: 3px; background: var(--scrim);
  color: #eef0f4; font: 500 11px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.thumb .seen { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.card b { display: block; font: 600 14px/1.3 var(--body); text-wrap: balance; }
.card small { display: block; color: var(--muted); font: 400 12.5px/1.35 var(--body); margin-top: 3px; }
.keys { color: var(--muted); font: 400 12.5px/1.5 var(--body); margin: 0; }
.keys kbd { font: 500 11.5px/1 var(--mono); border: 1px solid var(--hair); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: 600 14px/1.2 var(--body); border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--hair);
  background: var(--raise); color: var(--ink); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-accent); }
.btn:disabled { opacity: .6; cursor: default; }
.cp { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--gold); border-radius: 10px; background: var(--surface); min-width: 0; }
.cp .eyebrow { margin: 0; font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.cp h3 { margin: 0; font: 800 19px/1.3 var(--display); text-wrap: balance; }
.cp .page { margin: 0; background: var(--paper); border-radius: 6px; padding: 8px; overflow-x: auto; }
.cp .page img { display: block; width: 100%; max-width: 100%; height: auto; }
.cp .where { margin: 0; color: var(--muted); font-size: 13.5px; }
.cp .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tl .cpn { position: absolute; top: -6px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--gold); transform: rotate(45deg);
  border-radius: 1px; pointer-events: none; box-shadow: 0 0 0 2px var(--bg); }
.chapters .pen { width: 9px; height: 9px; margin-left: 1px; background: var(--gold); transform: rotate(45deg); border-radius: 1px; }
.chapters .ok { font-style: normal; color: var(--good); font-size: 12.5px; margin-left: 6px; }
.guide { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--hair); border-radius: 8px; }
.guide h3 { margin: 0; }
.guide p { margin: 0; color: var(--ink2); font-size: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tabs button { font: 600 15px/1.2 var(--body); padding: 9px 18px; border-radius: 999px; border: 1px solid var(--hair);
  background: none; color: var(--ink2); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.subj { display: grid; gap: 8px; }
.subj p { margin: 0; color: var(--ink2); font-size: 14px; }
.subj a { color: var(--accent); font-size: 14px; }
.switch { display: flex; gap: 8px; align-items: center; color: var(--ink2); font-size: 14px; cursor: pointer; }
.switch input { accent-color: var(--gold); width: 16px; height: 16px; margin: 0; }
.chat { display: grid; gap: 10px; border-top: 1px solid var(--hair); padding-top: 14px; }
.chat .head2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.chat h3 { margin: 0; font: 600 14px/1.2 var(--body); color: var(--ink2); }
.chat .link { background: none; border: 0; padding: 0; color: var(--muted); font: 500 13px/1 var(--body); cursor: pointer; }
.msgs { display: grid; gap: 12px; max-height: 460px; overflow-y: auto; padding-right: 6px; }
.msgs:empty { display: none; }
.msgs .q { justify-self: end; max-width: 85%; background: var(--raise); border-radius: 12px 12px 3px 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msgs .a { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.msgs .a.wait { color: var(--muted); }
.ts { font: 500 12.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); background: none; border: 1px solid var(--hair);
  border-radius: 4px; padding: 2px 5px; cursor: pointer; vertical-align: 1px; }
.ts:hover { background: var(--raise); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 500 13.5px/1.2 var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--hair); background: none; color: var(--ink2); cursor: pointer; }
.chips button:hover { background: var(--raise); color: var(--ink); }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.ask textarea { font: 400 15px/1.45 var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: 10px;
  padding: 9px 12px; resize: vertical; min-height: 44px; max-height: 240px; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chat .note { margin: 0; color: var(--muted); font-size: 12.5px; }
[hidden] { display: none !important; }  /* .cp etc. set display, which would otherwise beat the hidden attribute */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="blurb" id="blurb"></p>
    <div class="bar" aria-hidden="true"><i style="background:var(--sky)"></i><i style="background:var(--ember)"></i><i style="background:var(--mint)"></i><i style="background:var(--lilac)"></i><i style="background:var(--gold)"></i><i style="background:var(--rose)"></i></div>
    <p class="meta" id="meta"></p>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Subjects" hidden></nav>
  </header>
  <main class="layout">
    <section class="stage" aria-label="Player">
      <div class="frame"><video id="v" playsinline preload="metadata"></video><div class="vov" hidden></div></div>
      <p class="meta" id="status" hidden></p>
      <section class="cp" id="cp" hidden aria-live="polite" aria-label="Checkpoint"></section>
      <div class="now"><p class="meta" id="nowmeta"></p><h2 id="nowtitle"></h2><p class="sub" id="nowsub"></p></div>
      <div class="tl" id="tl" role="presentation"></div>
      <ol class="chapters" id="ch" aria-label="Chapters"></ol>
      <section class="chat" id="chat" hidden aria-label="Ask about this video">
        <div class="head2"><h3>Ask about this video</h3><button class="link" type="button" id="chatclear" hidden>Clear</button></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <form class="ask" id="askf"><textarea id="q" rows="2" aria-label="Your question" placeholder="Ask anything about this video…"></textarea>
          <button class="btn go" type="submit" id="askb">Ask</button></form>
        <p class="note" id="chatnote"></p>
      </section>
      <details class="tx" id="tx"><summary>Transcript</summary><div class="txb" id="txb"></div></details>
      <p class="keys"><kbd>k</kbd> play or pause · <kbd>j</kbd> <kbd>l</kbd> back or ahead 10 s · <kbd>n</kbd> <kbd>p</kbd> next or previous video · <kbd>c</kbd> captions</p>
    </section>
    <aside class="shelf" id="shelf" aria-label="Videos"></aside>
  </main>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ALL = D.videos || [];
const SUBJ = D.subjects || [];  // mtk site --subjects: one tab per project; videos carry their subject's slug
let tab = null, VIDS = ALL;
const $ = s => document.querySelector(s);
const v = $('#v');
const HUES = ['--sky', '--ember', '--mint', '--lilac', '--gold', '--rose'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const KEY = 'mtk:' + (D.title || '') + ':';
const store = {  // per-viewer conveniences only: where you left off, what you've watched
  get(k, d) { try { const x = localStorage.getItem(KEY + k); return x == null ? d : JSON.parse(x); } catch (e) { return d; } },
  set(k, x) { try { localStorage.setItem(KEY + k, JSON.stringify(x)); } catch (e) { } },
};
const KINDS = { episode: 'Episodes', problem: 'Problems' };
const guideOf = e => (e && e.guide) || null;  // mtk guide: each video's {pdf, pages, checkpoints: {id: {page, img}}}
const sk = k => tab ? `${k}:${tab}` : k;  // per-subject keys: checkpoint ids and 'last' repeat across subjects
let cpOpen = null, prevT = 0, dl = null;
const label = e => `${e.kind === 'problem' ? 'Problem' : 'Episode'} ${e.n}`;

/* ---------------- video loading (the Chromium seek fix) ----------------
   The artifact's file server ignores byte-range requests. Chromium then treats the video as unseekable
   (video.seekable is [0, 0]) and clamps every seek to 0 before any event fires: a rewind or a jump restarts the
   video, even into the part already buffered, and the page can't even learn where the viewer meant to go.
   So: the video streams natively for an instant start, with its native controls hidden. As soon as its metadata
   shows the stream is fully seekable (a server that serves ranges), the controls appear and that's it. If not,
   the whole file downloads right away (fetch() of published files is the supported path) and the player switches
   to that in-memory copy, which seeks anywhere, keeping position and play state; then the controls appear. Until
   then every seek goes through jump() (chapters, timeline, transcript, keys), which waits for the copy instead of
   letting Chromium snap to 0. If native loading fails outright (an error, or no metadata in 12 s), the copy is
   used directly. Test hooks: ?forceblob uses the copy from the start; ?native turns the fix off. */
const FORCE_BLOB = /forceblob/.test(location.search), NO_FIX = /native/.test(location.search);
const blobURLs = new Map(), blobJobs = new Map();
function freeBlobs() { blobURLs.forEach(u => URL.revokeObjectURL(u)); blobURLs.clear(); blobJobs.clear(); }
const mediaErr = x => x.error ? `media error ${x.error.code}${x.error.message ? ': ' + x.error.message : ''}` : 'no data';
const playBtn = document.createElement('button');
playBtn.className = 'next'; playBtn.type = 'button'; playBtn.textContent = '▶ Play';
playBtn.addEventListener('click', () => v.play().catch(() => {}));
function overlay(text, button) {
  const o = $('.vov');
  o.hidden = text == null && !button;
  o.textContent = text || '';
  if (button) o.appendChild(button);
}
function status(text) { const st = $('#status'); st.hidden = text == null; st.textContent = text || ''; }
function idle() {  // controls hidden and nothing to report: offer a play button
  if (!v.controls && v.paused && !v.dataset.seekTo && v.dataset.mode !== 'failed' && !cpOpen) overlay(null, playBtn);
}
function ready() {  // the video can seek anywhere now: hand over to the native controls
  v.controls = true;
  status(null);
  if ($('.vov').contains(playBtn)) overlay(null);
}
function reach(t) {  // can the browser seek to t natively?
  const r = v.seekable;
  for (let i = 0; i < r.length; i++) if (t >= r.start(i) - .05 && t <= r.end(i) + .05) return true;
  return false;
}
const fullySeekable = () => v.duration > 1 && reach(.5) && reach(v.duration - .5);
function blobFor(url, onPct) {
  if (blobURLs.has(url)) return Promise.resolve(blobURLs.get(url));
  let job = blobJobs.get(url);
  if (!job) {
    const listeners = new Set();
    job = (async () => {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`download failed (HTTP ${r.status})`);
      const total = +r.headers.get('content-length') || 0, rd = r.body && r.body.getReader();
      let blob;
      if (rd) {
        const parts = []; let got = 0;
        for (;;) {
          const { done, value } = await rd.read();
          if (done) break;
          parts.push(value); got += value.length;
          if (total) listeners.forEach(f => f(Math.round(100 * got / total)));
        }
        blob = new Blob(parts, { type: 'video/mp4' });
      } else blob = new Blob([await r.arrayBuffer()], { type: 'video/mp4' });
      const u = URL.createObjectURL(blob);
      blobURLs.set(url, u);
      return u;
    })();
    job.listeners = listeners;
    job.catch(() => blobJobs.delete(url));
    blobJobs.set(url, job);
  }
  if (onPct) job.listeners.add(onPct);
  return job;
}
async function swapToBlob(url, src) {  // keep position (or a pending jump) and play state
  if (v.dataset.want !== url || v.dataset.mode === 'blob' || v.dataset.mode === 'swapping') return;
  const t = v.currentTime, playing = !v.paused || v.dataset.play === '1';
  v.dataset.mode = 'swapping';
  try {
    await new Promise((ok, bad) => {
      v.addEventListener('loadedmetadata', ok, { once: true });
      v.addEventListener('error', () => bad(new Error(mediaErr(v))), { once: true });
      v.src = src;
    });
  } catch (e) { v.dataset.mode = 'failed'; throw e; }
  v.dataset.mode = 'blob';
  const target = v.dataset.seekTo ? +v.dataset.seekTo : t;  // a jump made while loading wins
  v.dataset.seekTo = '';
  if (target) v.currentTime = target;
  overlay(null);
  ready();
  if (playing) v.play().catch(() => {});
}
async function upgrade(url, why) {
  if (NO_FIX || v.dataset.dl === url) return;
  v.dataset.dl = url;
  if (why) overlay('Loading video…');
  status('Loading the full video so you can jump around…');
  try {
    const src = await blobFor(url, pct => {
      if (v.dataset.want !== url) return;
      status(`Loading the full video so you can jump around · ${pct}%`);
      if (why || v.dataset.seekTo) overlay(`${why ? 'Loading video' : 'Loading the full video to jump there'}… ${pct}%`);
    });
    await swapToBlob(url, src);
  } catch (e) {
    v.dataset.dl = '';
    if (v.dataset.want !== url) return;
    status(null);
    v.dataset.seekTo = '';
    if (why || v.dataset.mode === 'failed') { v.dataset.mode = 'failed'; overlay(`This video can't play here (${why || 'loading failed'}; then ${e.message}).`); }
    else { overlay(null); v.controls = true; }  // native still plays; seeking stays limited, but nothing breaks
  }
}
function jump(t, play) {  // every seek the page makes: exact, even before the video can seek
  t = Math.max(0, Math.min(t, (v.duration || (cur && cur.duration) || t) - .05));
  if (v.dataset.mode === 'swapping' || (v.dataset.mode === 'native' && !reach(t) && !NO_FIX)) {
    v.dataset.seekTo = String(t);  // applied when the in-memory copy arrives
    overlay('Loading the full video to jump there…');
    if (v.dataset.mode === 'native') upgrade(v.dataset.want);
  } else v.currentTime = t;
  if (play && v.paused) v.play().catch(() => {});
}
function wire() {
  const failed = why => { clearTimeout(+v.dataset.timer || 0); if (v.dataset.mode === 'native') { v.dataset.dl = ''; upgrade(v.dataset.want, why); } };
  v.addEventListener('error', () => failed(mediaErr(v)));
  v.addEventListener('loadstart', () => {  // native loading gets 12 s to produce metadata
    clearTimeout(+v.dataset.timer || 0);
    if (v.dataset.mode === 'native') v.dataset.timer = setTimeout(() => { if (v.readyState < 1) failed('no data after 12 s'); }, 12000);
  });
  v.addEventListener('loadedmetadata', () => {
    clearTimeout(+v.dataset.timer || 0);
    if (v.dataset.mode !== 'native') return;
    if (fullySeekable() || NO_FIX) ready();
    else { upgrade(v.dataset.want); idle(); }  // unseekable stream: fetch the seekable copy now
  });
  v.addEventListener('play', () => {
    v.dataset.play = '1';
    if ($('.vov').contains(playBtn)) overlay(null);
  });
  v.addEventListener('pause', () => { if (v.dataset.mode !== 'swapping') { v.dataset.play = ''; idle(); } });
  v.addEventListener('click', () => { if (!v.controls) v.paused ? v.play().catch(() => {}) : v.pause(); });
}
function setVideo(url) {
  clearTimeout(+v.dataset.timer || 0);
  v.dataset.want = url; v.dataset.play = ''; v.dataset.seekTo = ''; v.dataset.dl = '';
  overlay(null); status(null);
  v.controls = false;
  v.dataset.mode = 'native';
  if (FORCE_BLOB) upgrade(url, 'forced');
  else v.src = url;
}

/* ---------------- page ---------------- */
let cur = null, cues = null, lastSave = 0;
function seek(t) { jump(t, true); }

/* ---------------- checkpoints: the video pauses so the viewer works the guide ---------------- */
const cpList = e => (e && e.checkpoints) || [];
const isDone = id => !!store.get(sk('done:' + id), false);
const autoPause = () => store.get('autopause', true);
function saveBtn() {
  const G = guideOf(cur);
  if (!G) return '';
  if (dl) return '<button class="btn" type="button" data-act="save">Save this video\u2019s guide (PDF)</button>';
  if (!window.claude) return `<a class="btn" href="${esc(G.pdf)}" target="_blank" rel="noopener">Open this video\u2019s guide (PDF)</a>`;
  return '';  // inside claude.ai without the downloads capability: a file link wouldn't work
}
function openCheckpoint(c) {
  cpOpen = c;
  v.pause();
  const G = guideOf(cur), g = G && G.checkpoints && G.checkpoints[c.id];
  $('#cp').innerHTML = `<p class="eyebrow">Your turn · Checkpoint ${esc(c.id)}</p><h3>${esc(c.prompt)}</h3>
    ${g ? `<figure class="page"><img src="${esc(g.img)}" alt="Checkpoint ${esc(c.id)} as printed in the guide: ${esc(c.prompt)}"></figure>
      <p class="where">Page ${g.page} of your guide. Work it there, then come back: the video shows the answer next.</p>`
      : '<p class="where">Work it on paper, then come back: the video shows the answer next.</p>'}
    <div class="acts"><button class="btn primary" type="button" data-act="done">Done, show me the answer</button>
    <button class="btn" type="button" data-act="skip">Skip for now</button>${saveBtn()}</div>`;
  $('#cp').hidden = false;
  overlay(null);  // the video's own "Your turn" card is on screen; the panel below carries the rest
  try { $('#cp').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { }
}
function closeCheckpoint(done) {
  if (!cpOpen) return;
  if (done) store.set(sk('done:' + cpOpen.id), true);
  cpOpen = null;
  $('#cp').hidden = true;
  overlay(null);
  renderChapters(cur);
  renderShelf();
  tick();
}
async function saveGuide(btn) {
  btn.disabled = true;
  try {
    const blob = await (await fetch(guideOf(cur).pdf)).blob();
    await dl.save({ filename: `${(cur.title || D.title || 'Study').replace(/[^\w .-]+/g, '').trim() || 'Study'} guide.pdf`, data: blob });
    btn.textContent = 'Saved';
  } catch (e) {
    btn.textContent = e && e.code === 'declined' ? 'Save the guide (PDF)' : 'Saving isn\u2019t available here';
  } finally { btn.disabled = false; }
}

function renderShelf() {
  const kinds = [...new Set(VIDS.map(e => e.kind))];
  const all = VIDS.flatMap(cpList);
  const S = SUBJ.find(x => x.slug === tab);
  const subj = S && (S.blurb || (S.links || []).length) ? `<section class="subj"><h3>${esc(S.name)}</h3>${S.blurb ? `<p>${esc(S.blurb)}</p>` : ''}
    ${(S.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)} \u2197</a>`).join('')}</section>` : '';
  const guide = all.length ? `<section class="guide"><h3>Your guide</h3>
    <p>${all.filter(c => isDone(c.id)).length} of ${all.length} checkpoints done${SUBJ.length ? ' in ' + esc(S ? S.name : '') : ''}</p>${saveBtn()}
    <label class="switch"><input type="checkbox" id="autopause"${autoPause() ? ' checked' : ''}> Pause at checkpoints</label></section>` : '';
  $('#shelf').innerHTML = subj + guide + kinds.map(k => `<section><h3>${esc(KINDS[k] || k)}</h3><ul>${VIDS.filter(e => e.kind === k).map(e => {
    const seen = Math.min(1, store.get('seen:' + e.stem, 0));
    return `<li><button class="card" type="button" data-stem="${esc(e.stem)}"${cur && cur.stem === e.stem ? ' aria-current="true"' : ''}>
      <span class="thumb">${e.poster ? `<img src="${esc(e.poster)}" alt="" loading="lazy">` : ''}<span class="dur">${fmt(e.duration)}</span>
      <span class="seen" style="width:${(seen * 100).toFixed(1)}%"></span></span>
      <span><b>${esc(label(e))} · ${esc(e.title)}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}</span></button></li>`;
  }).join('')}</ul></section>`).join('');
}

function renderChapters(e) {
  const ch = e.chapters || [];
  const T = e.duration || 1;
  $('#tl').innerHTML = ch.map((c, i) => {
    const end = i + 1 < ch.length ? ch[i + 1].t : T;
    return `<span data-i="${i}" style="flex:${Math.max(.001, end - c.t)} 1 0;background:var(${HUES[i % HUES.length]})" title="${esc(c.label)}"></span>`;
  }).join('') + cpList(e).map(c => `<b class="cpn" style="left:${(100 * c.t / T).toFixed(3)}%"></b>`).join('') + '<i class="head" id="head"></i>';
  const rows = ch.map((c, i) => ({ t: c.t, html: `<li><button type="button" data-t="${c.t}" data-ci="${i}"><span class="dot" style="background:var(${HUES[i % HUES.length]})"></span><time>${fmt(c.t)}</time><span>${esc(c.label)}</span></button></li>` }))
    .concat(cpList(e).map(c => ({ t: c.t + .001, html: `<li><button type="button" data-t="${c.t}" data-cp="${esc(c.id)}"><span class="pen"></span><time>${fmt(c.t)}</time><span>Checkpoint ${esc(c.id)} · ${esc(c.prompt)}${isDone(c.id) ? '<em class="ok">done</em>' : ''}</span></button></li>` })))
    .sort((a, b) => a.t - b.t);
  $('#ch').innerHTML = rows.map(r => r.html).join('');
}

const capTrack = v.addTextTrack('captions', 'English', 'en');  // one track, refilled per video (cues are embedded)
function setCaptions(e) {
  const keep = capTrack.mode;
  capTrack.mode = 'hidden';  // cues are only reachable while the track isn't disabled
  while (capTrack.cues && capTrack.cues.length) capTrack.removeCue(capTrack.cues[0]);
  (e.cues || []).forEach(([a, b, text]) => capTrack.addCue(new VTTCue(a, b, text)));
  capTrack.mode = keep === 'showing' ? 'showing' : 'hidden';
}
function loadTranscript() {
  if (!cur) return;
  cues = (cur.cues || []).map(([a, b, text]) => ({ a, b, text }));
  $('#txb').innerHTML = cues.length ? cues.map((c, i) => `<button type="button" data-i="${i}"><time>${fmt(c.a)}</time><span>${esc(c.text)}</span></button>`).join('')
    : 'No transcript for this video.';
}

function open(stem, t, play) {
  const e = VIDS.find(x => x.stem === stem) || VIDS[0];
  if (!e) {
    closeCheckpoint(false); cur = null; v.removeAttribute('src'); v.load(); overlay(null);
    $('#nowmeta').textContent = ''; $('#nowsub').hidden = true; $('#tl').innerHTML = ''; $('#ch').innerHTML = '';
    $('#nowtitle').textContent = 'No videos here yet'; renderShelf(); renderChat(); return;
  }
  const same = cur && cur.stem === e.stem;
  cur = e;
  store.set(sk('last'), e.stem);
  if (!same) {
    closeCheckpoint(false);
    prevT = 0;
    freeBlobs();
    cues = null;
    $('#txb').innerHTML = '';
    v.poster = e.poster || '';
    setCaptions(e);
    setVideo(e.file);
    $('#nowmeta').textContent = `${label(e)} · ${fmt(e.duration)}`;
    $('#nowtitle').textContent = e.title;
    $('#nowsub').textContent = e.sub || '';
    $('#nowsub').hidden = !e.sub;
    renderChapters(e);
    if ($('#tx').open) loadTranscript();
    if (chatCtl) chatCtl.abort();
    renderChat();
  }
  const saved = store.get('pos:' + e.stem, 0);
  const resume = t == null && !same && saved > 5 && saved < (e.duration || 0) - 10 ? saved : null;
  if (t != null) {  // an explicit time (chapter link, #ep02.83): go there now
    if (v.readyState >= 1) jump(t, play);
    else v.addEventListener('loadedmetadata', () => jump(t, play), { once: true });
  } else if (resume != null) {  // where this viewer left off: applied on play, so opening the page downloads nothing
    $('#nowmeta').textContent += ` · resumes at ${fmt(resume)}`;
    v.addEventListener('play', () => {  // unless the viewer already chose a spot (a jump waiting for the copy)
      if (v.dataset.want === e.file && v.currentTime < 1 && !v.dataset.seekTo) jump(resume);
    }, { once: true });
    if (play) v.play().catch(() => {});
  } else if (play) v.play().catch(() => {});
  renderShelf();
  try { history.replaceState(null, '', '#' + e.stem); } catch (err) { }
}

/* ---------------- chat: ask Claude about this video ----------------
   Only on sites `mtk site` built where it found an Anthropic API key (D.chat). Served by `mtk serve`, questions go
   to its api/chat, which adds the key server-side; published as an artifact, the `sample` capability answers on
   each viewer's own claude.ai account. The key itself is never in the page. Conversations are per video, per
   viewer (localStorage). */
let chatAsk = null, chatCtl = null, chatOff = '';  // chatAsk(system, messages, onText, signal) -> full answer
const CHIPS = ['Summarize this video in three points', 'Explain what’s on screen right now', 'Quiz me on this video'];
const CHAT_ERR = { not_granted: 'Asking Claude isn’t allowed for this page', sampling_disabled: 'Claude isn’t available for this account',
  rate_limited: 'Too many questions for now: try again in a minute', session_expired: 'Sign in to claude.ai again, then ask',
  refused: 'Claude declined to answer that one', empty_completion: 'Claude gave no answer: try asking differently' };
const CHAT_OFF = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
function chatSystem(e) {  // stable per video, so the API can cache it; the viewer's position goes in each question
  const lines = (xs, f) => xs.map(f).join('\n'), cps = cpList(e);
  return `You answer questions from someone studying with a narrated explainer video, on the video's study page. Ground every answer in the video: its transcript is below, with times.
- Be brief: a few sentences or a short list, unless they ask for more. Use the video's own notation, names and examples.
- Point to the moment the video covers something as [m:ss], e.g. [1:23], with times from the transcript: the page turns these into links that jump the video there.
- If the video doesn't cover the question, say so in a sentence, then answer from general knowledge, marked as going beyond the video.
${cps.length ? '- Checkpoints are exercises the viewer is meant to work out alone before the video reveals the answer. For a checkpoint they have not marked done, give a hint or the next step, not the answer, unless they ask outright for the answer.\n' : ''}- Write math in plain text with Unicode (x², √2, eₙ₊₁, ≈), never LaTeX. Use **bold** sparingly; no headings.

VIDEO: ${label(e)}: ${e.title}${e.sub ? ` (${e.sub})` : ''}, ${fmt(e.duration)} long${D.title ? `, from "${D.title}"` : ''}

CHAPTERS
${lines(e.chapters || [], c => `[${fmt(c.t)}] ${c.label}`)}
${cps.length ? `\nCHECKPOINTS (the video pauses at each; the viewer works it in a PDF guide, then the video reveals the answer)\n${lines(cps, c => `[${fmt(c.t)}] ${c.id}: ${c.prompt}`)}\n` : ''}
TRANSCRIPT
${lines(e.cues || [], ([a, , text]) => `[${fmt(a)}] ${text}`)}`;
}
async function viaServer(system, messages, onText, signal) {  // mtk serve: plain text streamed back
  let text = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system, messages }), signal });
    if (!r.ok) { let m = `error ${r.status}`; try { m = (await r.json()).error || m; } catch (x) { } throw new Error(m); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await rd.read();
      if (done) return text;
      text += dec.decode(value, { stream: true });
      onText(text);
    }
  } catch (x) { throw { code: signal.aborted ? 'cancelled' : 'upstream_error', message: x.message, text }; }
}
const viaSample = sample => (system, messages, onText, signal) =>  // no system role: the instructions lead as a user turn
  sample([{ role: 'user', content: system }, ...messages], { model: D.chat.model, modelTier: 'default', cache: false, signal, onText: u => onText(u.text) })
    .then(r => r.text + (r.truncated ? '\n\n(The answer was cut off.)' : ''));
const rich = s => esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
  .replace(/\[(\d{1,3}):([0-5]\d)\]/g, (m, a, b) => `<button class="ts" type="button" data-t="${60 * a + +b}" title="Jump to ${a}:${b}">${a}:${b}</button>`);
function renderChat() {
  $('#chat').hidden = !chatAsk || !cur;
  if ($('#chat').hidden) return;
  const log = store.get('chat:' + cur.stem, []).filter(x => x.a || chatCtl), m = $('#msgs');
  m.innerHTML = log.map(x => `<div class="q">${esc(x.q)}</div><div class="a${x.a ? '' : ' wait'}">${x.a ? rich(x.a) : 'Thinking…'}</div>`).join('');
  m.scrollTop = m.scrollHeight;
  $('#chips').innerHTML = log.length || chatOff ? '' : CHIPS.map(c => `<button type="button">${esc(c)}</button>`).join('');
  $('#chatclear').hidden = !log.length || !!chatCtl;
  $('#askb').textContent = chatCtl ? 'Stop' : 'Ask';
  $('#q').disabled = $('#askb').disabled = !!chatOff;
  $('#chatnote').textContent = chatOff || `Answers come from Claude${D.chat.model ? ` (${D.chat.model})` : ''}, reading this video’s transcript${window.claude ? ', on your claude.ai account' : ''}. They can be wrong.`;
}
async function send(q) {
  q = q.trim();
  if (!q || !cur || !chatAsk || chatCtl) return;
  const e = cur, key = 'chat:' + e.stem, log = store.get(key, []).filter(x => x.a).slice(-9), cps = cpList(e);
  const ch = (e.chapters || []).filter(c => c.t <= v.currentTime + .5).pop();
  const ctx = `(I'm at ${fmt(v.currentTime)} in the video${ch ? `, in "${ch.label}"` : ''}${cps.length ? `; checkpoints I've done: ${cps.filter(c => isDone(c.id)).map(c => c.id).join(', ') || 'none'}` : ''}.)`;
  log.push({ q, ctx, a: '' });
  const messages = log.flatMap(x => [{ role: 'user', content: `${x.ctx}\n\n${x.q}` }].concat(x.a ? [{ role: 'assistant', content: x.a }] : []));
  const ctl = chatCtl = new AbortController();
  store.set(key, log);
  $('#q').value = '';
  renderChat();
  const out = $('#msgs').lastElementChild;
  let text = '', note = '';
  try {
    text = await chatAsk(chatSystem(e), messages, t => { if (cur === e) { out.className = 'a'; out.innerHTML = rich(t); } }, ctl.signal);
  } catch (err) {
    text = (err && err.text) || '';
    note = !err || err.code === 'cancelled' ? '' : CHAT_ERR[err.code] || (err.message ? `Couldn’t answer: ${err.message}` : 'Something went wrong; try again');
    if (err && CHAT_OFF.includes(err.code)) chatOff = note;
  }
  chatCtl = null;
  if (text) log[log.length - 1].a = text + (note ? `\n\n(${note}.)` : '');
  else { log.pop(); if (cur === e && !$('#q').value) $('#q').value = q; }
  store.set(key, log);
  if (cur === e) { renderChat(); if (note && !text && !chatOff) $('#chatnote').textContent = note + '.'; }
}
async function chatInit() {
  if (!D.chat) return;
  try {
    if (window.claude && window.claude.use) { const s = await window.claude.use('sample'); if (s) chatAsk = viaSample(s); }
    else { const r = await fetch('api/chat'); if (r.ok && (await r.json()).enabled) chatAsk = viaServer; }
  } catch (e) { }
  renderChat();
}
$('#askf').addEventListener('submit', ev => { ev.preventDefault(); if (chatCtl) chatCtl.abort(); else send($('#q').value); });
$('#q').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); if (!chatCtl) send($('#q').value); } });
$('#chips').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) send(b.textContent); });
$('#msgs').addEventListener('click', ev => { const b = ev.target.closest('.ts'); if (b) seek(+b.dataset.t); });
$('#chatclear').addEventListener('click', () => { if (cur) store.set('chat:' + cur.stem, []); renderChat(); });

function tick() {
  if (!cur) return;
  const t = v.currentTime, T = cur.duration || v.duration || 1;
  // playing across a checkpoint (not seeking past it) pauses there, until the viewer marks it done
  const hit = !v.paused && !cpOpen && autoPause() && t - prevT < 1.5
    && cpList(cur).find(c => prevT < c.t && c.t <= t && !isDone(c.id));
  prevT = t;
  if (hit) openCheckpoint(hit);
  const head = $('#head');
  if (head) head.style.left = `calc(${(100 * t / T).toFixed(3)}% - 1px)`;
  const ch = cur.chapters || [];
  let k = -1;
  ch.forEach((c, i) => { if (c.t <= t + .05) k = i; });
  document.querySelectorAll('#ch button[data-ci]').forEach(b => b.setAttribute('aria-current', String(+b.dataset.ci === k)));
  document.querySelectorAll('#tl span').forEach((s, i) => s.classList.toggle('on', i === k));
  if (cues && $('#tx').open) {
    document.querySelectorAll('#txb button').forEach((b, i) => b.classList.toggle('on', cues[i].a <= t && t < cues[i].b));
  }
  if (Date.now() - lastSave > 2000 && !v.seeking) {
    lastSave = Date.now();
    store.set('pos:' + cur.stem, t);
    store.set('seen:' + cur.stem, Math.max(store.get('seen:' + cur.stem, 0), t / T));
  }
}

function neighbor(step) {
  const same = VIDS.filter(e => e.kind === cur.kind);
  return same[same.indexOf(cur) + step];
}

v.addEventListener('timeupdate', tick);
v.addEventListener('seeking', () => { prevT = v.currentTime; });  // a jump never triggers a checkpoint
v.addEventListener('play', () => { if (cpOpen) closeCheckpoint(false); });  // pressing play is "skip for now"
v.addEventListener('seeked', tick);
v.addEventListener('ended', () => {
  store.set('pos:' + cur.stem, 0);
  store.set('seen:' + cur.stem, 1);
  renderShelf();
  const nx = neighbor(1);
  if (!nx) return;
  const b = document.createElement('button');
  b.className = 'next'; b.type = 'button';
  b.textContent = `Next: ${label(nx)} · ${nx.title}`;
  b.addEventListener('click', () => open(nx.stem, 0, true));
  overlay(null, b);
});
$('#shelf').addEventListener('click', ev => { const b = ev.target.closest('.card'); if (b) open(b.dataset.stem, null, true); });
$('#ch').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  const c = b.dataset.cp && cpList(cur).find(x => x.id === b.dataset.cp);
  if (c) { jump(c.t, false); openCheckpoint(c); } else seek(+b.dataset.t);
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'save') { saveGuide(b); return; }
  closeCheckpoint(b.dataset.act === 'done');
  v.play().catch(() => {});
});
$('#shelf').addEventListener('change', ev => { if (ev.target.id === 'autopause') store.set('autopause', ev.target.checked); });
$('#tl').addEventListener('click', ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  seek((ev.clientX - r.left) / r.width * (cur.duration || v.duration || 0));
});
$('#txb').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && cues) seek(cues[+b.dataset.i].a); });
$('#tx').addEventListener('toggle', () => { if ($('#tx').open) loadTranscript(); });
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || !cur) return;
  const k = ev.key.toLowerCase();
  if (k === 'k') { v.paused ? v.play().catch(() => {}) : v.pause(); }
  else if (k === 'j') seek(v.currentTime - 10);
  else if (k === 'l') seek(v.currentTime + 10);
  else if (k === 'n' || k === 'p') { const nx = neighbor(k === 'n' ? 1 : -1); if (nx) open(nx.stem, 0, true); }
  else if (k === 'c') capTrack.mode = capTrack.mode === 'showing' ? 'hidden' : 'showing';
  else return;
  ev.preventDefault();
});
function fromHash() {  // #ep02 opens episode 2; #ep02.83 opens it at 1:23 (with subjects: #physics-ep02)
  const m = location.hash.match(/^#([a-z][\w-]*?\d+)(?:\.(\d+))?$/i);
  const e = m && ALL.find(x => x.stem === m[1]);
  if (!e) return false;
  if (e.subject && e.subject !== tab) setTab(e.subject, true);
  open(m[1], m[2] ? +m[2] : null, false);
  return true;
}
function setTab(slug, quiet) {  // quiet: the caller opens a video itself
  tab = slug;
  VIDS = ALL.filter(e => e.subject === slug);
  store.set('tab', slug);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === slug)));
  meta();
  if (!quiet) open(store.get(sk('last'), VIDS[0] && VIDS[0].stem), null, false);
}
function meta() {
  const mins = VIDS.reduce((a, e) => a + (e.duration || 0), 0) / 60;
  const count = k => VIDS.filter(e => e.kind === k).length;
  $('#meta').textContent = [count('episode') && `${count('episode')} episode${count('episode') > 1 ? 's' : ''}`,
    count('problem') && `${count('problem')} problem walkthrough${count('problem') > 1 ? 's' : ''}`,
    `${Math.round(mins)} min`].filter(Boolean).join(' · ');
}
window.addEventListener('hashchange', fromHash);

$('#kicker').textContent = D.kicker || '';
$('#kicker').hidden = !D.kicker;
$('#title').textContent = D.heading || D.title || '';
$('#blurb').textContent = D.blurb || '';
$('#blurb').hidden = !D.blurb;
wire();
if (SUBJ.length) {
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = SUBJ.map(x => `<button type="button" role="tab" data-tab="${esc(x.slug)}" aria-selected="false">${esc(x.name)}</button>`).join('');
  $('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.dataset.tab !== tab) setTab(b.dataset.tab); });
  const saved = store.get('tab', null);
  setTab(SUBJ.some(x => x.slug === saved) ? saved : SUBJ[0].slug, true);
} else meta();
if (ALL.some(guideOf) && window.claude && window.claude.use) {  // the downloads capability: Save the guide
  window.claude.use('downloads').then(x => { dl = x; renderShelf(); if (cpOpen) openCheckpoint(cpOpen); }).catch(() => { });
}
chatInit();
if (!fromHash()) open(store.get(sk('last'), VIDS[0] && VIDS[0].stem), null, false);
</script>
